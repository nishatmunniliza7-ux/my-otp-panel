<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ALL OTP</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 360px;
            border: 1px solid #334155;
            text-align: center;
        }
        .logo {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 24px;
            font-weight: bold;
        }
        h2 { margin: 0 0 5px 0; font-size: 22px; }
        .author { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #f1f5f9;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            color: #0f172a;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, #ff5e62, #ff9966);
            border: none;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error { color: #ef4444; font-size: 13px; margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">⚡</div>
        <h2>ALL OTP</h2>
        <div class="author">BY R3DOX CLONE</div>
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign in</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
